<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Radar SECOP | BARAX Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Rajdhani:wght@700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../assets/logos/barax-symbol-dark.svg">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/oportunidades.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a href="/" class="nav-logo" aria-label="BARAX Defense and Technology">
      <img src="../assets/logos/barax-symbol-dark.svg" alt="" class="nav-logo-symbol" width="34" height="34">
      <span class="nav-logo-lockup">
        <span class="nav-logo-wordmark">BARAX</span>
        <span class="nav-logo-descriptor">Radar SECOP</span>
      </span>
    </a>
    <form id="loginForm">
      <div class="login-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="password">Clave</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="login-error" id="loginError"></p>
      <button type="submit" class="btn-p" id="loginSubmit">Entrar</button>
    </form>
  </div>
</div>
<script src="../assets/js/login.js"></script>
</body>
</html>
